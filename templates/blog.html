{{define "title"}}{{t "title.blog"}}{{end}}

{{define "extra_css"}}
<link rel="stylesheet" href="/static/css/blog.css?v={{staticVer}}">
{{end}}

{{define "content"}}
<div class="container-blog">
  <div class="blog-header">
    <h2>{{t "blog.heading"}}</h2>
    <p>{{t "blog.sub"}}</p>
  </div>
  <div class="post-list" data-endpoint="/api/posts" data-kind="blog" aria-live="polite"></div>
</div>

<script src="/static/js/postlist.js?v={{staticVer}}"></script>
{{end}}
