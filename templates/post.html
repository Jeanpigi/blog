{{define "title"}}{{.Post.Title}} — JbearP{{end}}

{{define "meta"}}
<meta name="description" content="{{.Post.Description}}">
<link rel="canonical" href="https://blog.jbearp.com/post/{{.Post.ID}}">
<meta property="og:site_name" content="JbearP Blog">
<meta property="og:type" content="article">
<meta property="og:title" content="{{.Post.Title}}">
<meta property="og:description" content="{{.Post.Description}}">
<meta property="og:url" content="https://blog.jbearp.com/post/{{.Post.ID}}">
<meta property="og:image" content="https://blog.jbearp.com/static/assets/Jean.webp">
<meta name="twitter:card" content="summary">
{{end}}

{{define "extra_css"}}
<link rel="stylesheet" href="/static/css/posts.css?v={{staticVer}}">
{{end}}

{{define "content"}}
<div class="container-post">
  <article class="post-article">

    <header class="post-header">
      <div class="post-meta">
        <span class="post-categoria">{{.Post.Categoria}}</span>
        <span class="post-created-at" data-created-at="{{.Post.CreatedAt}}"></span>
      </div>
      <h1 class="post-title">{{.Post.Title}}</h1>
      <p class="post-description">{{.Post.Description}}</p>
    </header>

    <div class="post-content">{{.ContentHTML}}</div>

    <footer class="post-footer">
      <div class="share-buttons">
        <span class="share-label">Compartir:</span>
        <a class="social-btn facebook" target="_blank" rel="noopener"
           href="https://www.facebook.com/sharer/sharer.php?u={{printf "https://blog.jbearp.com/post/%d" .Post.ID}}"
           aria-label="Compartir en Facebook">
          <i class="fab fa-facebook-f"></i>
        </a>
        <a class="social-btn twitter" target="_blank" rel="noopener"
           href="https://x.com/intent/post?url={{printf "https://blog.jbearp.com/post/%d" .Post.ID}}&text={{.Post.Title}}"
           aria-label="Compartir en X">
          <i class="fab fa-x-twitter"></i>
        </a>
        <a class="social-btn whatsapp" target="_blank" rel="noopener"
           href="https://api.whatsapp.com/send?text={{.Post.Title}}%20https://blog.jbearp.com/post/{{.Post.ID}}"
           aria-label="Compartir en WhatsApp">
          <i class="fab fa-whatsapp"></i>
        </a>
        <a class="social-btn telegram" target="_blank" rel="noopener"
           href="https://t.me/share/url?url=https://blog.jbearp.com/post/{{.Post.ID}}&text={{.Post.Title}}"
           aria-label="Compartir en Telegram">
          <i class="fab fa-telegram-plane"></i>
        </a>
      </div>
    </footer>

  </article>
</div>

<script src="/static/js/createdAt.js?v={{staticVer}}"></script>
{{end}}
