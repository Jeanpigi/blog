# Abre PRs semanales con actualizaciones de dependencias (Go y GitHub Actions).
# Complementa a Trivy: Trivy detecta vulnerabilidades, Dependabot propone el fix.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-deps:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
